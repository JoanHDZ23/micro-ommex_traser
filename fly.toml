# Configuración de Fly.io para el backend de Trazabilidad.
# Sin add-ons (no se usa Tigris/Postgres/Redis): el estado está en MongoDB + R2.
app = "micro-traser"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  # Always-on: la máquina NUNCA se apaga ni se suspende por inactividad.
  #  - auto_stop_machines = "off"  → desactiva el autostop/suspend.
  #  - min_machines_running = 1    → mantiene siempre 1 máquina corriendo.
  #  - auto_start_machines = true  → por si se detuviera manualmente, revive al recibir tráfico.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
