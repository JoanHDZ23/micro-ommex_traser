<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular blanco suave -->
  <circle cx="256" cy="256" r="240" fill="white"/>

  <!-- Anillo exterior -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#bg)" stroke-width="22"/>

  <!-- Anillo medio -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#bg)" stroke-width="18"/>

  <!-- Anillo interior -->
  <circle cx="256" cy="256" r="78" fill="none" stroke="url(#bg)" stroke-width="16"/>

  <!-- Flecha curva externa (cuadrante inferior-izquierdo) -->
  <path d="M 120 310 A 155 155 0 0 1 256 101" fill="none" stroke="url(#bg)" stroke-width="28" stroke-linecap="round"/>
  <!-- Punta de flecha izquierda -->
  <polygon points="100,298 88,340 132,318" fill="#7c3aed"/>

  <!-- Flecha recta diagonal hacia arriba-derecha (indicador) -->
  <line x1="240" y1="272" x2="360" y2="152" stroke="url(#arrow)" stroke-width="26" stroke-linecap="round"/>
  <!-- Punta de flecha diagonal -->
  <polygon points="356,140 400,128 384,172" fill="#9333ea"/>

  <!-- Punto central -->
  <circle cx="256" cy="256" r="22" fill="url(#bg)"/>
</svg>
